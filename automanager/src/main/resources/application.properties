logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR
logging.level.com.zaxxer.hikari=WARN
logging.level.com.autobots.automanager.AutomanagerApplication=INFO
logging.level.org.springframework.boot.web.embedded.tomcat.TomcatWebServer=INFO
spring.main.banner-mode=off
spring.main.log-startup-info=true

spring.datasource.url=jdbc:mysql://localhost:3306/av3DW3?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.batch_fetch_style=dynamic
spring.jpa.open-in-view=true

server.error.include-stacktrace=never
